name: Build WheeDownloader Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بنقرة زر

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos Environment
        uses: theos/setup-theos@v1

      - name: Compile Dylib
        run: |
          make
          # التأكد من وجود ملف dylib الناتج
          find .theos/obj/ -name "*.dylib"

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WheeDownloader-Dylib
          path: .theos/obj/*.dylib
          if-no-files-found: error
