name: Build Theos Tweak (dylib)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Cache Theos
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      - name: 🛠️ Install dependencies
        run: |
          brew update || true
          brew install dpkg ldid make git perl

      - name: 📦 Setup Theos and SDK 16.5
        run: |
          THEOS_PATH="${{ github.workspace }}/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          
          if [ ! -d "$THEOS_PATH" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS_PATH"
          fi

          if [ ! -d "$THEOS_PATH/sdks/iPhoneOS16.5.sdk" ]; then
            mkdir -p "$THEOS_PATH/sdks"
            curl -L -o "$THEOS_PATH/sdks/iPhoneOS16.5.sdk.tar.xz" \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf "$THEOS_PATH/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS_PATH/sdks"
            rm "$THEOS_PATH/sdks/iPhoneOS16.5.sdk.tar.xz"
          fi

      - name: 🧩 Build dylib
        run: |
          export PATH="$THEOS/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO

          echo "🏗️ Building dylib using Theos from $THEOS..."
          make clean
          make FINALPACKAGE=1
          
          mkdir -p output
          find .theos/obj/ -name "*.dylib" -exec cp {} output/ \;
          echo "✅ dylib build finished"

      - name: 📤 Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: STikPro-dylib
          path: output/*.dylib
