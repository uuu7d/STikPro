name: Build WheeDownloader Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install & Setup Theos
        run: |
          # 1. تحميل بيئة Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 2. إزالة مجلد sdks الافتراضي لتجنب تعارض git clone
          rm -rf $HOME/theos/sdks
          
          # 3. جلب الـ SDKs بكتلة خفيفة وسريعة (--depth=1)
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          
          # 4. تعريف متغير البيئة THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Compile Dylib
        run: |
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WheeDownloader-Dylib
          path: .theos/obj/*.dylib
          if-no-files-found: error
